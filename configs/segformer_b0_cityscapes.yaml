# CLEAR-MoE Configuration — SegFormer-B0 on Cityscapes Segmentation
# Adapted for GTX 960 (2-4GB VRAM)

model:
  name: nvidia/segformer-b0-finetuned-cityscapes-1024-1024
  source: transformers        # HuggingFace transformers
  pretrained: true
  num_classes: 19
  input_size: 512             # Reduced from 1024 for VRAM

data:
  task: segmentation
  dataset: cityscapes         # HuggingFace cityscapes dataset
  # cityscapes_dir: /path/to/cityscapes  # Set for local data
  calib_size: 200             # Small calibration set for segmentation
  val_batch_size: 1           # Segmentation is memory-heavy
  num_workers: 2
  pin_memory: true
  crop_size: 512              # Center crop for development

extraction:
  num_experts: 4
  layer_selection: last_half
  top_k: null
  threshold: null
  method: clear_moe
  shared_basis_rank: null

router:
  type: linear
  hidden_dim: 64
  lr: 1.0e-3
  epochs: 5
  weight_decay: 0.01
  scheduler: cosine
  balance_coeff: 0.01
  adaptive_routing: false
  confidence_threshold: 0.6

runtime:
  dtype: float32
  routing: top1
  route_sorting: true

evaluation:
  metrics:
    - miou
    - per_class_iou
    - latency_p50
    - latency_p90
    - throughput
    - memory_peak
    - energy_per_image
  latency_warmup: 5
  latency_iterations: 20

seed: 42
output_dir: outputs
device: cuda

expert_counts: [2, 4, 8, 16]
basis_ranks: [8, 16, 32, 64]
calib_sizes: [50, 200, 500, 2000]
router_depths: [0, 1, 2]
dispatch_strategies: [naive, grouped, stream, fusion, adaptive, triton, cublas_gemm]
parallelism_modes: [cpu_serial, cpu_mt, gpu_single, ep2, dp2, pp2]
moe_architectures: [flat_hard, hmoe, soft, elastic]
