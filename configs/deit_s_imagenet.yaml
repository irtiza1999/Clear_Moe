# CLEAR-MoE Configuration — DeiT-Small on ImageNet Classification
# Adapted for GTX 960 (2-4GB VRAM)

model:
  name: deit_small_patch16_224
  source: timm               # Use timm model zoo
  pretrained: true
  num_classes: 1000
  input_size: 224

data:
  task: classification
  dataset: imagenette         # Use 'imagenette' for dev, 'imagenet' for full eval
  # imagenet_dir: /path/to/imagenet  # Set this for full ImageNet-1K
  calib_size: 2000            # Calibration subset size (reduced for GTX 960)
  val_batch_size: 4           # Small batch for limited VRAM
  num_workers: 2
  pin_memory: true

extraction:
  num_experts: 4              # Reduced from 8 for lower memory
  layer_selection: last_half  # 'last_half', 'last_third', 'top_k', 'threshold'
  top_k: null                 # Used when layer_selection='top_k'
  threshold: null             # Used when layer_selection='threshold'
  method: clear_moe           # 'clear_moe', 'disjoint', 'moefication'
  shared_basis_rank: null     # null = auto (use 50% of hidden dim)

router:
  type: linear                # 'linear' or 'mlp'
  hidden_dim: 64              # Only for 'mlp' type
  lr: 1.0e-3
  epochs: 5
  weight_decay: 0.01
  scheduler: cosine
  balance_coeff: 0.01         # Entropy regularization for load balance
  adaptive_routing: false     # Enable confidence-based top-k escalation
  confidence_threshold: 0.6   # For adaptive routing

runtime:
  dtype: float32              # GTX 960 Maxwell arch — use fp32
  routing: top1               # 'top1' or 'adaptive'
  route_sorting: true         # Enable token sorting for grouped execution

evaluation:
  metrics:
    - top1
    - top5
    - accuracy_retention
    - active_params
    - ffn_macs
    - latency_p50
    - latency_p90
    - throughput
    - energy_per_image
  latency_warmup: 10
  latency_iterations: 50

seed: 42
output_dir: outputs
device: cuda                  # Force GPU

# Extended sweep fields (scripts 14, 12, 13, 10, 11, 16)
expert_counts: [2, 4, 8, 16]
basis_ranks: [8, 16, 32, 64]
calib_sizes: [50, 200, 500, 2000]
router_depths: [0, 1, 2]          # 0=linear, 1=one hidden layer, 2=two hidden layers
dispatch_strategies: [naive, grouped, stream, fusion, adaptive, triton, cublas_gemm]
parallelism_modes: [cpu_serial, cpu_mt, gpu_single, ep2, dp2, pp2]
moe_architectures: [flat_hard, hmoe, soft, elastic]
