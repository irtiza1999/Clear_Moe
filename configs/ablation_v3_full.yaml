# CLEAR-MoE++ v3 — Full ablation sweep config
# Drives scripts 17-25

model:
  name: deit_small_patch16_224
  source: timm
  pretrained: true
  num_classes: 10
  input_size: 224

data:
  task: classification
  dataset: imagenette
  data_dir: data/imagenette/imagenette2-320
  calib_size: 500
  val_batch_size: 8
  num_workers: 4
  pin_memory: true

extraction:
  num_experts: 4
  layer_selection: last_half
  method: clear_moe
  shared_basis_rank: null

router:
  type: linear
  hidden_dim: 64
  lr: 1.0e-3
  epochs: 5
  weight_decay: 0.01
  scheduler: cosine
  balance_coeff: 0.01

runtime:
  dtype: float32
  routing: top1
  route_sorting: true
  dispatch_backend: grouped

evaluation:
  metrics: [top1, accuracy_retention, latency_p50, latency_p90, throughput]
  latency_warmup: 10
  latency_iterations: 50

seed: 42
output_dir: outputs
device: cuda

# v3 sweep axes — used by scripts 17-25
router_types:
  - top1
  - top2
  - expert_choice
  - comm_aware
  - path_consistent
  - self_routing
  - shared_expert

bucket_modes:
  - none
  - expert_sort
  - group_sort
  - latent_bucket

hot_expert_policies:
  - none
  - overflow_dense
  - shadow_replica

runtime_backends:
  - naive
  - grouped
  - stream
  - triton
  - cublas_gemm

parallel_modes:
  - serial
  - ep2
  - ep4
  - pp2
  - ep2_pp2
  - ep2_stream

# CommAwareRouter lambda sweep
lambda_comm_values: [0.0, 0.1, 0.3, 1.0]
lambda_hot_values: [0.0, 0.1, 0.3, 1.0]
lambda_comm: 0.1
lambda_hot: 0.1

# PathConsistentRouter
path_penalty_coeff_values: [0.0, 0.01, 0.1]
path_penalty_coeff: 0.01

# Expert counts for sweep
expert_counts: [2, 4, 8, 16]
basis_ranks: [8, 16, 32, 64]

# SimulatedEP settings
simulated_ep_ranks: [1, 2, 4]
comm_latency_us: 100  # simulated all-to-all latency in microseconds

# SimulatedPP settings
simulated_pp_stages: [1, 2, 4]
micro_batch_sizes: [2, 4, 8]

# HotExpertManager
hot_expert_threshold: 2.0   # trigger replication when load > threshold * mean
hot_expert_ema_momentum: 0.9
hot_expert_capacity_limit: 16  # max tokens per expert before overflow

# Precision adaptation (script 25)
precision_adaptation:
  overloaded_dtype: float16
  normal_dtype: float32
